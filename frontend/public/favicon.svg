<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="6" y1="2" x2="58" y2="62">
      <stop offset="0" stop-color="#4f78f2"/>
      <stop offset=".55" stop-color="#3358d4"/>
      <stop offset="1" stop-color="#1f3594"/>
